# Plotmark website on GitLab Pages.
# - Every commit to main republishes the site.
# - A weekly schedule (and any commit message containing [market]) refreshes
#   the Dubai market trends page from Dubai Land Department open data.
stages: [build, deploy]

market-data:
  stage: build
  image: python:3.12-slim
  timeout: 45m
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_MESSAGE =~ /\[market\]/
  script:
    - python3 scripts/market/fetch.py
  artifacts:
    paths: [market-data/]
    expire_in: 30 days

pages:
  stage: deploy
  image: python:3.12-slim
  needs:
    - job: market-data
      optional: true
      artifacts: true
  script:
    - python3 scripts/market/render.py
    - mkdir .public
    - cp -r * .public
    - rm -rf .public/scripts .public/market-data .public/README.md
    - mv .public public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
